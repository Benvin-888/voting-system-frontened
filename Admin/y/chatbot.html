<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Kirinyaga County · Voting Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #c8e0c8 0%, #a8c9a8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        /* subtle coffee‑leaf pattern (county signature) – optimised for performance */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.06"><path d="M20 30 Q 30 20 40 30 T 60 30" stroke="%232e7d32" fill="none" stroke-width="1.5"/><circle cx="45" cy="25" r="2" fill="%232e7d32"/><path d="M70 70 Q 80 60 90 70" stroke="%231b5e20" fill="none" stroke-width="1.5"/></svg>');
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
            will-change: transform; /* minor performance hint */
        }

        .chatbot-container {
            width: 100%;
            max-width: 480px;
            height: 80dvh;
            max-height: 850px;
            min-height: 560px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: clamp(28px, 6vw, 40px) clamp(28px, 6vw, 40px) clamp(20px, 4vw, 28px) clamp(20px, 4vw, 28px);
            box-shadow: 0 30px 60px -20px #1b4f1b,
                        0 0 0 1px rgba(76, 175, 80, 0.35) inset,
                        0 12px 28px -8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,240,0.8);
            position: relative;
            z-index: 2;
            transition: border-radius 0.2s;
        }

        /* landscape mode adjustments */
        @media (orientation: landscape) and (max-height: 600px) {
            .chatbot-container {
                height: 95dvh;
                max-height: none;
                min-height: 320px;
                border-radius: 20px 20px 12px 12px;
            }
        }

        /* ---------- HEADER ---------- */
        .chat-header {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            padding: clamp(8px, 2vh, 14px) clamp(12px, 3vw, 18px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 3px solid #f5b342;
            box-shadow: 0 6px 14px rgba(0,30,0,0.25);
            flex-shrink: 0;
            gap: 8px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: clamp(6px, 2vw, 12px);
            min-width: 0;
            flex: 1;
        }

        .logo-area a {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-img {
            height: clamp(36px, 8vh, 44px);
            width: auto;
            filter: drop-shadow(0 3px 5px #0f3f0f);
            transition: transform 0.2s;
            border-radius: 10px;
            object-fit: contain;
        }
        .logo-img:hover { transform: scale(1.02); }

        .logo-fallback {
            display: none;
            font-size: 2.2rem;
            line-height: 1;
            background: rgba(255,255,240,0.2);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            text-align: center;
        }

        .county-name {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .county-name .main-title {
            font-weight: 700;
            font-size: clamp(1rem, 4.5vw, 1.25rem);
            line-height: 1.2;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .county-name .sub-title {
            font-size: clamp(0.6rem, 3vw, 0.7rem);
            opacity: 0.9;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: clamp(6px, 2vw, 12px);
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: clamp(40px, 10vw, 48px);
            height: clamp(40px, 10vw, 48px);
            border-radius: 50%;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,224,0.5);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 8px rgba(0, 30, 0, 0.2);
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-btn:hover {
            background: #f5b342;
            color: #1b5e20;
            transform: scale(1.1) rotate(2deg);
            border-color: white;
        }
        .icon-btn:active { transform: scale(0.98); }

        .lang-badge {
            font-size: 0.7rem;
            background: #f5b342;
            color: #1b5e20;
            border-radius: 30px;
            padding: 2px 6px;
            margin-left: 2px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1;
        }

        /* ---------- MESSAGES ---------- */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: clamp(12px, 3vh, 20px) clamp(10px, 2.5vw, 18px) clamp(8px, 2vh, 14px);
            background: rgba(245, 255, 240, 0.4);
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2vh, 16px);
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #4caf50 #e0f0e0;
        }

        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: #e0f0e0; }
        .chat-messages::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 20px; }

        .message-row {
            display: flex;
            width: 100%;
            animation: slideIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion) {
            .message-row { animation: none; }
        }

        .message-row.bot { justify-content: flex-start; }
        .message-row.user { justify-content: flex-end; }

        .message-bubble {
            max-width: 85%;
            padding: clamp(10px, 2.5vh, 16px) clamp(14px, 3vw, 22px);
            border-radius: 24px;
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            line-height: 1.5;
            white-space: pre-line;
            word-break: break-word;
            box-shadow: 0 6px 16px -6px rgba(27, 94, 32, 0.25);
            backdrop-filter: blur(2px);
        }

        .bot .message-bubble {
            background: #fffffff2;
            border-bottom-left-radius: 6px;
            border: 1px solid #c8e0c8;
            color: #1a3b1a;
        }

        .user .message-bubble {
            background: linear-gradient(145deg, #4caf50, #2e7d32);
            color: white;
            border-bottom-right-radius: 6px;
            border: 1px solid #f5b342;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: clamp(10px, 2.5vh, 16px) clamp(16px, 4vw, 24px);
            background: #eff9ef;
            border-radius: 28px;
            border-bottom-left-radius: 6px;
            width: fit-content;
            border: 1px solid #b8dcb8;
        }

        .typing-indicator span {
            width: 10px;
            height: 10px;
            background: #2e7d32;
            border-radius: 50%;
            opacity: 0.7;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ---------- SUGGESTIONS (CHIPS) ---------- */
        .suggestions-area {
            padding: clamp(10px, 2vh, 16px) clamp(8px, 2vw, 14px);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid #f5b34260;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            max-height: 160px;
            overflow-y: auto;
            flex-shrink: 0;
            scrollbar-width: thin;
        }

        @media (max-width: 420px) {
            .suggestions-area { gap: 6px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .suggestions-area { max-height: 100px; }
        }

        .chip {
            background: white;
            border: 2px solid #4caf50;
            color: #1b5e20;
            padding: clamp(8px, 2vh, 12px) clamp(12px, 3vw, 22px);
            border-radius: 60px;
            font-size: clamp(0.75rem, 3.5vw, 0.95rem);
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(46,125,50,0.2);
            transition: 0.15s;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 0 1 auto;
            backdrop-filter: blur(2px);
            letter-spacing: 0.2px;
            -webkit-tap-highlight-color: transparent;
            min-width: 120px; /* ensures chips are not too narrow */
            text-align: center;
        }

        @media (max-width: 360px) {
            .chip {
                min-width: 100px;
                padding: 8px 10px;
                font-size: 0.75rem;
            }
        }
        @media (max-width: 280px) {
            .chip {
                flex: 1 1 100%; /* full width on very tiny screens */
                white-space: normal;
                min-width: auto;
            }
        }

        .chip:hover {
            background: #4caf50;
            color: white;
            border-color: #f5b342;
            transform: translateY(-3px);
            box-shadow: 0 16px 24px -8px #2e7d32;
        }
        .chip:active { transform: translateY(0); }

        /* ---------- INPUT AREA ---------- */
        .input-area {
            display: flex;
            padding: clamp(8px, 2vh, 14px) clamp(10px, 2.5vw, 16px) clamp(12px, 3vh, 20px);
            background: rgba(255, 255, 255, 0.9);
            border-top: 1px solid #c8e0c8;
            gap: 8px;
            backdrop-filter: blur(4px);
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: clamp(10px, 2.5vh, 14px) clamp(16px, 4vw, 24px);
            border: 2px solid #d4ead4;
            border-radius: 60px;
            font-size: clamp(0.9rem, 4vw, 1rem);
            outline: none;
            background: #ffffff;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(0,40,0,0.03);
            min-width: 0;
        }

        .input-area input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 5px rgba(46,125,50,0.15);
        }

        .send-btn {
            background: #2e7d32;
            border: none;
            color: white;
            width: clamp(48px, 12vw, 62px);
            height: clamp(48px, 12vw, 62px);
            border-radius: 50%;
            font-size: clamp(1.6rem, 6vw, 2rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            box-shadow: 0 6px 14px #1b5e20;
            border: 2px solid #f5b342;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .send-btn:hover {
            background: #1b5e20;
            transform: scale(1.06) rotate(-2deg);
            border-color: white;
        }
        .send-btn:active { transform: scale(0.98); }

        /* hidden scroll hint (optional) */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }
    </style>
</head>
<body>
<div class="chatbot-container" id="chatbotContainer">
    <!-- header with Kirinyaga County identity -->
    <div class="chat-header">
        <div class="logo-area">
            <a href="index.html" id="logoLink" aria-label="Home">
                <img src="Logo.png" alt="Kirinyaga County coat of arms" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                <span class="logo-fallback" role="img" aria-label="Kirinyaga">🗳️</span>
            </a>
            <div class="county-name">
                <span class="main-title">Kirinyaga County</span>
                <span class="sub-title">Voting System</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="globeBtn" title="Select language" aria-label="Choose language">
                🌐<span class="lang-badge" id="currentLangBadge">EN</span>
            </button>
            <button class="icon-btn" id="closeChatBtn" title="Go to dashboard" aria-label="Close and go to dashboard">✕</button>
        </div>
    </div>

    <!-- main chat area -->
    <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions"></div>

    <!-- suggestion chips (dynamic) -->
    <div class="suggestions-area" id="suggestionChips" role="group" aria-label="Suggested actions"></div>

    <!-- text input -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask about voting..." autocomplete="off" aria-label="Your question">
        <button class="send-btn" id="sendBtn" aria-label="Send message">➤</button>
    </div>
</div>

            voting_day: '📅 Siku',
            security_privacy: '🔒 Security',
            faq: '❓ Maswali',
            live_results: '📊 Results',
            language: '🌐 Olulimi',
            voting_transaction: '✅ Voting',
            back_to_menu: '🔙 Menu',
            how_to_vote_msg: `Khuya namba yio.`,
            registration_msg: `ID ne simu.`,
            voting_day_msg: `Shikha namba.`,
            security_msg: `Kura ni siri.`,
            faq_msg: `Mara kabiri? Awa.`,
            live_results_msg: `Results.`,
            voting_transaction_msg: `Process.`,
            language_msg: 'Londa olulimi:',
            error_msg: 'Shindakhulile.'
        },
        luo: {
            greeting: '👋🏾 Amosi! Wabiro e Kirinyaga County Voting System.',
            how_to_vote: '🗳️ Vota',
            registration_help: '📝 Registration',
            voting_day: '📅 Siku',
            security_privacy: '🔒 Security',
            faq: '❓ FAQ',
            live_results: '📊 Results',
            language: '🌐 Dhok',
            voting_transaction: '✅ Voting',
            back_to_menu: '🔙 Menu',
            how_to_vote_msg: `Ket namba, bende vota.`,
            registration_msg: `Nyis ID gi simu.`,
            voting_day_msg: `Kik nyiso namba.`,
            security_msg: `Kura en mopondo.`,
            faq_msg: `Vota ariyo? Ooyo.`,
            live_results_msg: `Results.`,
            voting_transaction_msg: `Process.`,
            language_msg: 'Yer dhok:',
            error_msg: 'Ok aneno.'
        }
    };

    const LANGUAGES = {
        en: 'English', sw: 'Kiswahili', kikuyu: 'Gĩkũyũ', kamba: 'Kikamba',
        embeere: 'Kiembu', maasai: 'Maa', luhya: 'Luhya', luo: 'Dholuo'
    };

    let currentLang = 'en';

    function t(key) {
        if (translations[currentLang] && translations[currentLang][key] !== undefined) {
            return translations[currentLang][key];
        }
        return translations['en'][key] || key;
    }

    // Update language badge
    function updateLangBadge() {
        const badge = document.getElementById('currentLangBadge');
        if (badge) {
            badge.textContent = currentLang.toUpperCase().substring(0, 2);
        }
    }

    // ----- DOM elements -----
    const chatMessages = document.getElementById('chatMessages');
    const suggestionChips = document.getElementById('suggestionChips');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const closeBtn = document.getElementById('closeChatBtn');
    const globeBtn = document.getElementById('globeBtn');

    // ----- navigation -----
    closeBtn.addEventListener('click', () => window.location.href = 'index.html');

    // ----- typing & messaging -----
    let isTyping = false;

    function addMessage(sender, text) {
        const row = document.createElement('div');
        row.className = `message-row ${sender}`;
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerText = text;
        row.appendChild(bubble);
        chatMessages.appendChild(row);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function botReplyWithTyping(responseText, showMenuAfter = true) {
        if (isTyping) return;
        isTyping = true;

        const typingRow = document.createElement('div');
        typingRow.className = 'message-row bot';
        typingRow.id = 'typingIndicator';
        const typingBubble = document.createElement('div');
        typingBubble.className = 'typing-indicator';
        typingBubble.innerHTML = '<span></span><span></span><span></span>';
        typingRow.appendChild(typingBubble);
        chatMessages.appendChild(typingRow);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        setTimeout(() => {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
            addMessage('bot', responseText);
            if (showMenuAfter) showMainMenu();
            isTyping = false;
        }, 600);
    }

    // ----- chips management -----
    function setSuggestions(chipsArray) {
        suggestionChips.innerHTML = '';
        chipsArray.forEach(chip => {
            const btn = document.createElement('button');
            btn.className = 'chip';
            btn.innerText = chip.label;
            btn.addEventListener('click', () => {
                addMessage('user', chip.label);
                handleCommand(chip.command);
            });
            suggestionChips.appendChild(btn);
        });
    }

    function getMainMenuChips() {
        return [
            { label: t('how_to_vote'), command: 'how_to_vote' },
            { label: t('registration_help'), command: 'registration_help' },
            { label: t('voting_day'), command: 'voting_day' },
            { label: t('security_privacy'), command: 'security_privacy' },
            { label: t('faq'), command: 'faq' },
            { label: t('live_results'), command: 'live_results' },
            { label: t('voting_transaction'), command: 'voting_transaction' },
            { label: t('language'), command: 'language' }
        ];
    }

    function getLanguageMenuChips() {
        return [
            { label: '🇬🇧 English', command: 'lang_en' },
            { label: '🇰🇪 Kiswahili', command: 'lang_sw' },
            { label: '🔹 Gĩkũyũ', command: 'lang_kikuyu' },
            { label: '🔹 Kikamba', command: 'lang_kamba' },
            { label: '🔹 Kiembu', command: 'lang_embeere' },
            { label: '🔹 Maa', command: 'lang_maasai' },
            { label: '🔹 Luhya', command: 'lang_luhya' },
            { label: '🔹 Dholuo', command: 'lang_luo' },
            { label: t('back_to_menu'), command: 'main_menu' }
        ];
    }

    function showMainMenu() {
        setSuggestions(getMainMenuChips());
    }

    function handleCommand(cmd) {
        if (cmd.startsWith('lang_')) {
            let newLang = cmd.substring(5);
            if (LANGUAGES.hasOwnProperty(newLang)) {
                currentLang = newLang;
                updateLangBadge();
                let confirmKey = `lang_selected_${newLang}`;
                let confirmText = t(confirmKey);
                if (confirmText === confirmKey) {
                    confirmText = `🌐 Language set to ${LANGUAGES[newLang]}`;
                }
                botReplyWithTyping(confirmText, false);
                setTimeout(() => showMainMenu(), 800);
            } else {
                currentLang = 'en';
                updateLangBadge();
                botReplyWithTyping('🌐 Language set to English', false);
                setTimeout(() => showMainMenu(), 800);
            }
            return;
        }

        let responseText = '';
        let showMenuAfter = true;
        switch (cmd) {
            case 'how_to_vote': responseText = t('how_to_vote_msg'); break;
            case 'registration_help': responseText = t('registration_msg'); break;
            case 'voting_day': responseText = t('voting_day_msg'); break;
            case 'security_privacy': responseText = t('security_msg'); break;
            case 'faq': responseText = t('faq_msg'); break;
            case 'live_results': responseText = t('live_results_msg'); break;
            case 'voting_transaction': responseText = t('voting_transaction_msg'); break;
            case 'language':
                responseText = t('language_msg');
                showMenuAfter = false;
                botReplyWithTyping(responseText, false);
                setTimeout(() => setSuggestions(getLanguageMenuChips()), 700);
                return;
            case 'main_menu':
                showMainMenu();
                return;
            default:
                responseText = t('error_msg');
                break;
        }
        if (responseText) botReplyWithTyping(responseText, showMenuAfter);
    }

    function handleUserText(text) {
        if (!text.trim()) return;
        addMessage('user', text);
        botReplyWithTyping(t('error_msg'), true);
    }

    // ----- event listeners -----
    sendBtn.addEventListener('click', () => {
        handleUserText(userInput.value);
        userInput.value = '';
    });
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendBtn.click();
        }
    });

    globeBtn.addEventListener('click', () => {
        addMessage('user', '🌐 ' + t('language'));
        botReplyWithTyping(t('language_msg'), false);
        setTimeout(() => setSuggestions(getLanguageMenuChips()), 700);
    });

    // ----- initial greeting -----
    window.addEventListener('load', () => {
        updateLangBadge();
        setTimeout(() => {
            addMessage('bot', t('greeting'));
            showMainMenu();
        }, 300);
    });

    // ----- optional: handle orientation change to adjust scroll -----
    window.addEventListener('orientationchange', () => {
        setTimeout(() => chatMessages.scrollTop = chatMessages.scrollHeight, 100);
    });
})();
</script>
