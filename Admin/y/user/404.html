<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Lost in space</title>
  <!-- Font Awesome 6 (modern icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary-green: #2e7d32;
      --light-green: #4caf50;
      --dark-green: #1b5e20;
      --white: #ffffff;
      --light-gray: #f5f5f5;
      --medium-gray: #e0e0e0;
      --dark-gray: #616161;
      --warning: #ff9800;
      --danger: #f44336;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, var(--light-green) 0%, var(--dark-green) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .error-card {
      max-width: 600px;
      width: 100%;
      background: var(--white);
      border-radius: 32px;
      padding: 48px 40px;
      box-shadow: 0 30px 60px rgba(27, 94, 32, 0.3);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
    }

    .error-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 40px 70px rgba(27, 94, 32, 0.4);
    }

    .logo {
      margin-bottom: 32px;
    }

    .logo a {
      display: inline-block;
    }

    .logo img {
      max-height: 60px;
      width: auto;
      border-radius: 12px;
      transition: opacity 0.2s;
    }

    .logo img:hover {
      opacity: 0.9;
    }

    .error-code {
      font-size: 130px;
      font-weight: 800;
      background: linear-gradient(145deg, var(--primary-green), var(--dark-green));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 10px;
      letter-spacing: -6px;
      text-shadow: 4px 8px 20px rgba(46, 125, 50, 0.2);
    }

    h1 {
      font-size: 36px;
      color: var(--dark-green);
      margin-bottom: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 18px;
      color: var(--dark-gray);
      margin-bottom: 32px;
      line-height: 1.6;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
    }

    .illustration {
      margin: 20px 0 25px;
      font-size: 70px;
      line-height: 1;
      opacity: 0.9;
      animation: float 3s ease-in-out infinite;
      color: var(--primary-green);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .search-box {
      display: flex;
      max-width: 400px;
      margin: 0 auto 35px;
      border-radius: 60px;
      overflow: hidden;
      border: 2px solid var(--medium-gray);
      transition: border-color 0.2s, box-shadow 0.2s;
      background: var(--white);
    }

    .search-box:focus-within {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.2);
    }

    .search-box input {
      flex: 1;
      padding: 16px 22px;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: var(--dark-gray);
    }

    .search-box input::placeholder {
      color: #aaa;
    }

    .search-box button {
      background: var(--primary-green);
      border: none;
      color: white;
      padding: 0 28px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box button i {
      font-size: 16px;
    }

    .search-box button:hover {
      background: var(--dark-green);
    }

    .action-links {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .action-links a {
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 60px;
      font-weight: 600;
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      border: 2px solid transparent;
    }

    .action-links a:first-child {
      background: var(--primary-green);
      color: var(--white);
      box-shadow: 0 12px 22px -8px var(--primary-green);
    }

    .action-links a:first-child i {
      color: white;
    }

    .action-links a:first-child:hover {
      background: var(--dark-green);
      transform: translateY(-3px);
      box-shadow: 0 18px 30px -8px var(--dark-green);
    }

    .action-links a:last-child {
      background: var(--white);
      color: var(--primary-green);
      border-color: var(--primary-green);
    }

    .action-links a:last-child i {
      color: var(--primary-green);
    }

    .action-links a:last-child:hover {
      background: #e8f5e9;
      transform: translateY(-3px);
    }

    .help-links {
      margin-top: 15px;
      font-size: 15px;
      color: var(--dark-gray);
    }

    .help-links a {
      color: var(--primary-green);
      text-decoration: none;
      font-weight: 600;
      margin: 0 5px;
      transition: color 0.2s;
    }

    .help-links a:hover {
      color: var(--dark-green);
      text-decoration: underline;
    }

    .help-links i {
      font-size: 12px;
      margin-left: 4px;
    }

    @media (max-width: 500px) {
      .error-card {
        padding: 35px 20px;
      }
      .error-code {
        font-size: 100px;
        letter-spacing: -4px;
      }
      h1 {
        font-size: 28px;
      }
      .illustration {
        font-size: 55px;
      }
      .search-box {
        flex-direction: column;
        border-radius: 30px;
      }
      .search-box button {
        padding: 14px;
        justify-content: center;
      }
      .action-links a {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <!-- Logo with link to homepage -->
    <div class="logo">
      <a href="/">
        <img src="Logo.png" alt="Company Logo">
      </a>
    </div>

    <div class="error-code">404</div>
    <div class="illustration">
      <i class="fas fa-map-signs"></i> <!-- modern icon -->
    </div>
    <h1>Lost your way?</h1>
    <p>Sorry, we couldn't find the page you're looking for. It might have been moved or never existed.</p>

    <!-- Search box with icon -->
    <div class="search-box">
      <input type="text" placeholder="Search our site..." aria-label="Search">
      <button type="button"><i class="fas fa-magnifying-glass"></i> Search</button>
    </div>

    <!-- Primary actions with icons -->
    <div class="action-links">
      <a href="index.html">
        <i class="fas fa-house"></i> Back to Home
      </a>
      <a href="Feedback.html">
        <i class="fas fa-comment-dots"></i> Feedback Support
      </a>
    </div>

    <!-- Secondary help links -->
    <div class="help-links">
      <span>or visit <a href="/blog">Blog <i class="fas fa-arrow-right"></i></a> or <a href="/faq">FAQ <i class="fas fa-arrow-right"></i></a></span>
    </div>
  </div>
</body>
</html>
